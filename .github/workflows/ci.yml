name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install stable MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install stable MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MOON_HOME: D:/mfl-moon
          MOONC_OVERRIDE: D:/mfl-moon/bin/moonc.exe
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'D:/mfl-moon/bin'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'MOON_HOME=D:/mfl-moon'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'MOONC_OVERRIDE=D:/mfl-moon/bin/moonc.exe'
      - name: Record toolchain
        run: moon version --all
      - name: Initialize public package registry
        run: moon update
      - name: Verify (Unix)
        if: runner.os != 'Windows'
        run: moon run --deny-warn scripts/verify.mbtx
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MOON_CC: cl
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          moon run --deny-warn scripts/verify.mbtx
      - name: Verify local source package without publishing
        if: runner.os == 'Linux'
        run: moon run --deny-warn scripts/package_check.mbtx
  webdav-interop:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional pinned integration server
        run: python -m pip install -r integration/requirements.txt
      - name: Check integration dependency closure
        run: python -m pip check
      - name: Install stable MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Initialize public package registry
        run: moon update
      - name: Test actual WsgiDAV server and published MoonBit client
        run: moon run --deny-warn scripts/wsgidav_demo.mbtx
